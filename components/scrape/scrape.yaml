apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: envoy-scrape
  namespace: mesh-lab
  labels:
    laboratorio.sre.dev/proprietario: mesh-apps-lab
spec:
  podSelector:
    matchLabels:
      app: httpbin
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability-apps
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 15090
