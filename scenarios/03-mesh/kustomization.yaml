apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
# Namespace deste objeto; não confundir com seleção de namespaces de origem.
namespace: mesh-lab
labels:
- pairs:
    laboratorio.sre.dev/proprietario: mesh-apps-lab
  includeSelectors: false
patches:
- target:
    kind: Namespace
    name: mesh-lab
  patch: "- op: replace\n  path: /metadata/labels/istio.io~1rev\n  value: mesh-stable\n"
- target:
    kind: Deployment
  patch: "- op: replace\n  path: /spec/template/metadata/annotations/sidecar.istio.io~1inject\n\
    \  value: \"true\"\n"
