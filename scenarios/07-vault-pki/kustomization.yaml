apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mesh-vault-lab
resources:
- ../../base
- security.yaml
patches:
- target:
    kind: Namespace
    name: mesh-lab
  patch: "- op: replace\n  path: /metadata/name\n  value: mesh-vault-lab\n- op: replace\n\
    \  path: /metadata/labels/istio.io~1rev\n  value: vault-stable\n- op: replace\n\
    \  path: /metadata/labels/istio-discovery\n  value: mesh-vault\n"
- target:
    kind: Deployment
  patch: "- op: replace\n  path: /spec/template/metadata/annotations/sidecar.istio.io~1inject\n\
    \  value: 'true'\n"
- target:
    kind: Deployment
    name: sleep-denied
  patch: "- op: replace\n  path: /spec/template/metadata/annotations/sidecar.istio.io~1inject\n\
    \  value: 'false'\n"
