apiVersion: v1
kind: ServiceAccount
metadata:
  name: sleep-plain
---
apiVersion: v1
kind: Service
metadata:
  name: sleep-plain
  labels:
    app: sleep-plain
spec:
  ports:
  - port: 80
    name: http
  # Seletores precisam corresponder aos labels dos recursos de destino.
  selector:
    app: sleep-plain
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sleep-plain
spec:
  # Número de instâncias; réplicas isoladamente não garantem alta disponibilidade.
  replicas: 1
  selector:
    matchLabels:
      app: sleep-plain
  template:
    metadata:
      labels:
        app: sleep-plain
      annotations:
        sidecar.istio.io/inject: 'false'
    spec:
      terminationGracePeriodSeconds: 0
      serviceAccountName: sleep-plain
      containers:
      - name: sleep
        image: quay.io/sail-dev/curl@sha256:88a9abad9d958340e48564f9bdcdaa29916a2984be59314da709f8bbc0eef6f7
        command:
        - /bin/sleep
        - infinity
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - mountPath: /etc/sleep/tls
          name: secret-volume
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        # Restringe privilégios do processo; conferir compatibilidade com a SCC.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: secret-volume
        secret:
          secretName: sleep-secret
          optional: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
